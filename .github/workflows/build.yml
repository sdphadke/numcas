name: Build
on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install toolchain
        uses: numworks/setup-arm-toolchain@2020-q2
      - name: Install autoconf macros
        run: sudo apt-get update && sudo apt-get install -y autoconf-archive
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install nwlink
        run: |
          npm install --global nwlink@0.0.15
          test -n "$(nwlink eadk-cflags)"
      - name: Check EADK flags
        run: make check-eadk NWLINK="nwlink"
      - name: Run make build
        run: make build NWLINK="nwlink"
      - name: Run make check
        run: make check NWLINK="nwlink"
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            output/autoconf/*/configure.log
            output/autoconf/*/make.log
      - name: Upload numcas build
        uses: actions/upload-artifact@v4
        with:
          name: numcas-nwa
          path: output/numcas.nwa
          if-no-files-found: error
      - name: Release on tag
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "numcas ${{ github.ref_name }} — CAS for NumWorks, Modernized"
          body: |
            numcas — CAS for NumWorks, Modernized.

            Flash `numcas.nwa` to your NumWorks calculator (firmware v26).
          files: output/numcas.nwa
